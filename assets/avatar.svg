<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="诸葛宇轩的卡通狐狸头像">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1e6"/>
      <stop offset="1" stop-color="#fecdd3"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="200" rx="100" fill="url(#bg)"/>

  <!-- 耳朵 -->
  <path d="M64 80 L42 30 L94 58 Z" fill="#ea580c"/>
  <path d="M136 80 L158 30 L106 58 Z" fill="#ea580c"/>
  <path d="M58 70 L47 42 L80 58 Z" fill="#7c2d12"/>
  <path d="M142 70 L153 42 L120 58 Z" fill="#7c2d12"/>

  <!-- 脸（心形狐狸脸） -->
  <path d="M100 150 C64 140 46 116 51 87 C54 64 73 52 100 67 C127 52 146 64 149 87 C154 116 136 140 100 150 Z" fill="url(#fur)"/>

  <!-- 白色脸颊与口鼻 -->
  <ellipse cx="72" cy="117" rx="19" ry="15" fill="#fff7ed"/>
  <ellipse cx="128" cy="117" rx="19" ry="15" fill="#fff7ed"/>
  <path d="M100 120 C84 121 83 141 100 147 C117 141 116 121 100 120 Z" fill="#fff7ed"/>

  <!-- 眼睛 -->
  <circle cx="77" cy="99" r="8.5" fill="#1c1917"/>
  <circle cx="123" cy="99" r="8.5" fill="#1c1917"/>
  <circle cx="79.5" cy="96.5" r="3.2" fill="#ffffff"/>
  <circle cx="125.5" cy="96.5" r="3.2" fill="#ffffff"/>

  <!-- 腮红 -->
  <ellipse cx="60" cy="113" rx="7" ry="4.5" fill="#fda4af" opacity="0.75"/>
  <ellipse cx="140" cy="113" rx="7" ry="4.5" fill="#fda4af" opacity="0.75"/>

  <!-- 鼻子与嘴 -->
  <path d="M93 125 Q100 137 107 125 Q100 130 93 125 Z" fill="#7c2d12"/>
  <path d="M100 131 L100 138 M100 138 Q94 143 88 139 M100 138 Q106 143 112 139"
        stroke="#7c2d12" stroke-width="2.6" fill="none" stroke-linecap="round"/>
</svg>
