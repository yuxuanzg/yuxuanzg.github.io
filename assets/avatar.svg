<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="zgyx 头像占位图">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="200" height="200" rx="100" fill="url(#g)"/>
  <!-- 晶格点阵装饰 -->
  <g fill="#ffffff" opacity="0.28">
    <circle cx="42" cy="44" r="3.5"/><circle cx="66" cy="44" r="3.5"/>
    <circle cx="90" cy="44" r="3.5"/><circle cx="114" cy="44" r="3.5"/>
    <circle cx="42" cy="68" r="3.5"/><circle cx="66" cy="68" r="3.5"/>
    <circle cx="90" cy="68" r="3.5"/><circle cx="114" cy="68" r="3.5"/>
    <circle cx="86" cy="132" r="3.5"/><circle cx="110" cy="132" r="3.5"/>
    <circle cx="134" cy="132" r="3.5"/><circle cx="158" cy="132" r="3.5"/>
    <circle cx="86" cy="156" r="3.5"/><circle cx="110" cy="156" r="3.5"/>
    <circle cx="134" cy="156" r="3.5"/><circle cx="158" cy="156" r="3.5"/>
  </g>
  <!-- 名字首字母 -->
  <text x="100" y="134" font-size="88" font-family="Arial, Helvetica, sans-serif"
        font-weight="bold" fill="#ffffff" text-anchor="middle">Z</text>
  <!-- 替换提示 -->
  <text x="100" y="186" font-size="11" font-family="Arial, Helvetica, sans-serif"
        fill="#ffffff" opacity="0.7" text-anchor="middle">替换为你的照片</text>
