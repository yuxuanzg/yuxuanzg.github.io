    <section class="section">

        <div class="card-grid cols-2">
          <div class="card project-card reveal">
            <div class="project-top">
              <span class="project-badge badge-indigo">进行中</span>
              <h3>强关联体系的数值模拟</h3>
            </div>
            <p>使用精确对角化（ED）等方法研究小尺寸格点模型（如 Hubbard 模型、t-J 模型）中的关联效应与量子相变现象。</p>
            <div class="project-meta">
              <span class="chip chip-sm">Python</span>
              <span class="chip chip-sm">量子多体</span>
              <span class="chip chip-sm">精确对角化</span>
            </div>
          </div>

          <div class="card project-card reveal">
            <div class="project-top">
              <h3>摩尔超晶格计算</h3>
            </div>
            <p>关于黑磷等四方晶格材料，计算twisted bilayer的能带结构，构建其连续模型以及紧束缚模型，探索可能存在的新奇性质和材料平台。</p>
            <div class="project-meta">
              <span class="chip chip-sm">QE, Siesta</span>
              <span class="chip chip-sm">凝聚态计算</span>
            </div>
          </div>
